    <script>
      // Protection against "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      // This happens when a polyfill (like formdata-polyfill) tries to reassign the native fetch.
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function() { 
                console.warn('Blocked an attempt to override native window.fetch');
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // If we can't redefine it, it might already be non-configurable
          console.warn('Fetch protection could not be initialized:', e.message);
        }
      })();
    </script>
