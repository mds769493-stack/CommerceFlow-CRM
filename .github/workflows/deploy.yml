name: Auto Build & Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      # Note: If you use cPanel FTP or SSH deployment, secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD) can be configured in GitHub Settings -> Secrets.
